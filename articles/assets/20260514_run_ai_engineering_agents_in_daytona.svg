<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Daytona AI engineering agent workflow</title>
  <desc id="desc">A flow from GitHub repositories through Daytona workspaces to Omni Engineer and Claude Engineer runtimes.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="70" y="90" width="1060" height="450" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="100" y="150" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Running AI engineering agents in Daytona</text>
  <text x="100" y="190" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Dev Containers make the Python runtime, dependencies, secrets, and ports repeatable.</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="105" y="260" width="230" height="130" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="135" y="305" font-size="22" font-weight="700" fill="#075985">GitHub repo</text>
    <text x="135" y="338" font-size="16" fill="#0f172a">.devcontainer/</text>
    <text x="135" y="363" font-size="16" fill="#0f172a">devcontainer.json</text>
    <path d="M350 325 H455" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="470" y="245" width="260" height="160" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="505" y="295" font-size="22" font-weight="700" fill="#166534">Daytona workspace</text>
    <text x="505" y="328" font-size="16" fill="#0f172a">Python 3.11 image</text>
    <text x="505" y="353" font-size="16" fill="#0f172a">pip install requirements</text>
    <text x="505" y="378" font-size="16" fill="#0f172a">workspace-scoped API keys</text>
    <path d="M745 325 H850" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="865" y="230" width="230" height="90" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="895" y="268" font-size="21" font-weight="700" fill="#92400e">Omni Engineer</text>
    <text x="895" y="296" font-size="15" fill="#0f172a">python main.py</text>
    <rect x="865" y="350" width="230" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="895" y="388" font-size="21" font-weight="700" fill="#5b21b6">Claude Engineer</text>
    <text x="895" y="416" font-size="15" fill="#0f172a">uv run ce3.py or app.py</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
